repos:
  # Backend Python hooks
  - repo: https://github.com/psf/black
    rev: 23.12.0
    hooks:
      - id: black
        files: ^backend/
        args: [--config=backend/pyproject.toml]

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        files: ^backend/
        args: [--settings-path=backend/pyproject.toml]

  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        files: ^backend/
        args: [--config=backend/.flake8]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        files: ^backend/src/
        args: [--config-file=backend/mypy.ini]
        additional_dependencies: [sqlalchemy, pydantic]

  # Frontend TypeScript/Vue hooks
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.55.0
    hooks:
      - id: eslint
        files: ^frontend/.*\.[jt]sx?$
        types: [file]
        args: [--fix, --config=frontend/.eslintrc.js]
        additional_dependencies:
          - eslint@8.55.0
          - eslint-plugin-vue@9.19.2
          - '@typescript-eslint/parser@6.13.2'
          - '@typescript-eslint/eslint-plugin@6.13.2'
          - vue-eslint-parser

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/
        types_or: [javascript, jsx, ts, tsx, vue, css, json, yaml]
        args: [--config=frontend/.prettierrc]

  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key

