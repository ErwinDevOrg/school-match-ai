[pytest]
# Pytest configuration for async tests

# Minimum version
minversion = 7.0

# Test paths
testpaths = tests

# Python path
pythonpath = .

# Async mode
asyncio_mode = auto

# Add options
addopts =
    -ra
    -q
    --strict-markers
    --cov=src
    --cov-report=html
    --cov-report=term
    --cov-report=term-missing
    --cov-fail-under=0

# Coverage source
[coverage:run]
source = src
omit =
    */tests/*
    */alembic/*
    */__pycache__/*

# Coverage report
[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
    @abstractmethod

